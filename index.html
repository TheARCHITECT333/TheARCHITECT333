<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Backend & systems engineer building high-throughput data pipelines, low-latency APIs, and the services that scale them." />
    <title>Subhajeet Kar — Backend Engineer</title>

    <!--
      Social share / SEO tags. Crawlers (Facebook, LinkedIn, X/Twitter, Slack…)
      don't run JS, so these must be static. og:url and og:image must be ABSOLUTE
      URLs — replace the https://subhajeetkar.dev placeholder domain below with
      your real domain once deployed (also in robots.txt and sitemap.xml).
    -->
    <link rel="canonical" href="https://subhajeetkar.dev/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Subhajeet Kar" />
    <meta property="og:title" content="Subhajeet Kar — Backend Engineer" />
    <meta property="og:description" content="Backend & systems engineer building high-throughput data pipelines, low-latency APIs, and the services that scale them." />
    <meta property="og:url" content="https://subhajeetkar.dev/" />
    <meta property="og:image" content="https://subhajeetkar.dev/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Subhajeet Kar — Backend Engineer" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Subhajeet Kar — Backend Engineer" />
    <meta name="twitter:description" content="Backend & systems engineer building high-throughput data pipelines, low-latency APIs, and the services that scale them." />
    <meta name="twitter:image" content="https://subhajeetkar.dev/og-image.png" />
    <meta name="theme-color" content="#0a0a0b" />
    <script>
      // Set theme before first paint to avoid a flash of the wrong theme.
      (function () {
        try {
          var t = localStorage.getItem('theme');
          if (t !== 'light' && t !== 'dark') {
            t = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
          }
          document.documentElement.setAttribute('data-theme', t);
        } catch (e) {}
      })();
      document.documentElement.classList.add('js-reveal');
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
